name: Build, test and publish subscription
on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - 'pluginmaster.json'
      - 'index.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/checkout@v7
        with:
          repository: chihya72/gkms-localify-dmm-RE
          path: out/framework-source
          persist-credentials: false
      - name: Package SDK for the independent plugin build
        run: |
          $framework = Join-Path $PWD 'out\framework-source'
          [string[]]$arguments = @('pack', (Join-Path $framework 'Sdk\Gkms.Sdk.csproj'), '-c', 'Release', '-o', (Join-Path $PWD 'out\sdk'))
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw 'SDK packaging failed' }
      - name: Build plugins and raw subscription indexes
        run: |
          $parameters = @{ SdkFeed = (Join-Path $PWD 'out\sdk') }
          & (Join-Path $PWD 'Plugins\Build-Repository.ps1') @parameters
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Plugin packaging failed' }
      - name: Run framework integration and native overlay tests
        run: |
          $parameters = @{ OfficialPluginOutput = (Join-Path $PWD 'out\Release'); Overlay = $true }
          & (Join-Path $PWD 'out\framework-source\Tests\Test-OfficialPlugins.ps1') @parameters
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Integration tests failed' }
      - name: Verify online and offline catalogs
        run: |
          & (Join-Path $PWD 'Plugins\Test-Repository.ps1') -StageRoot (Join-Path $PWD 'out\Release')
          if (-not $?) { throw 'Catalog verification failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: official-plugin-subscription
          path: |
            out/Release/online/*.json
            out/Release/plugin-packages/*.zip
            out/Release/gakumas-local/re/official-plugins.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: official-plugin-subscription
          path: out/publish
      - name: Publish ZIPs and raw indexes to the source repository
        run: |
          [string[]]$arguments = @('config', 'user.name', 'github-actions[bot]')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Git author setup failed' }
          [string[]]$arguments = @('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Git email setup failed' }
          & (Join-Path $PWD 'Plugins\Publish-Repository.ps1') -StageRoot (Join-Path $PWD 'out\publish')
          if (-not $? -or $LASTEXITCODE -ne 0) { throw 'Subscription publication failed' }
